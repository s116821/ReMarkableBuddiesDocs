schema: spec-driven

context: |
  RemarkableBuddiesDocs is the sole OpenSpec authority for three repositories.
  ReMarkableBuddies is the unified Rust tablet application; RemarkableBuddiesManager
  is the Angular browser and Electron companion. The implemented product is Reader Buddy,
  a Linux tablet service using framebuffer capture, evdev/uinput and OpenAI.
  Preserve runtime behavior unless current available issue/task requirements schedule a change.
  Current implementation outranks historical plans and README approximations.
  Use full proposal, design, delta specs and tasks before implementation; verify,
  sync canonical specs and archive completed work in linked central Docs and component PRs with exact
  revisions, shared acceptance evidence and coordinated merge order. Keep actual evidence in PR
  comments, not the concise Summary-only PR body. Never commit credentials.

rules:
  specs:
    - Include observable failure behavior and distinguish implemented from planned features.
    - Give each requirement at least one WHEN/THEN scenario and source traceability.
  tasks:
    - Include verification, canonical spec sync, and archival before PR completion.
